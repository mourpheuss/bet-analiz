name: Model Geriye Donuk Test (Backtest)

on:
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gereksinimleri Yukle
        run: |
          pip install requests

      - name: Backtest Motorunu Calistir
        run: |
          python backtester.py
