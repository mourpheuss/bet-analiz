name: MAS 5-Dakika Otomatik Analiz Motoru

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-mas-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Kesintisiz 5 Dakika Döngüsü (1 Saat Boyunca)
        run: |
          echo "================================================="
          echo "MAS KESİNTİSİZ 5 DAKİKALIK OTOMATİK DÖNGÜ BAŞLADI"
          echo "================================================="
          for i in {1..12}; do
            echo "-------------------------------------------------"
            echo ">> DÖNGÜ $i / 12 ÇALIŞTIRILIYOR [$(date '+%Y-%m-%d %H:%M:%S')]"
            echo "-------------------------------------------------"
            
            python main.py || echo "[UYARI] Ağ hatası atlandı, döngü devam ediyor."
            
            if [ $i -lt 12 ]; then
              echo ">> 5 dakika bekleniyor (300 saniye)..."
              sleep 300
            fi
          done
          echo "================================================="
          echo "1 Saatlik Analiz Otomasyonu Tamamlandı."
          echo "================================================="